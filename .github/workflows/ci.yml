name: CI Pipeline

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check (Prettier)
        run: npx prettier --check .

      - name: Linting (ESLint)
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Smoke Test Production Healthcheck
        run: |
          PORT=8080 node .output/server/index.mjs &
          sleep 4
          curl -f http://localhost:8080/api/health || exit 1
